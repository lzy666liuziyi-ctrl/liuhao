name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps (none)
        run: npm install --no-package-lock --no-save typescript

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Demo run
        run: npm run demo

      - name: Test
        run: npm run test
